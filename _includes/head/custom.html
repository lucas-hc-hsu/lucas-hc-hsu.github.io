{% include base_path %}

<!-- start custom head snippets -->

<!-- The favicon bundle that came with the template pointed at files this repo
     has never contained: nine apple-touch-icon PNGs, six android-chrome PNGs
     listed in a manifest still named "Minimal Mistakes", and four Windows tile
     images. Every one of them 404ed on the live site, the nine on every single
     page load. What is left is the profile photo, the only icon art this site
     actually has, plus one apple-touch-icon so an iOS home-screen bookmark gets
     it rather than a screenshot. -->
<link rel="apple-touch-icon" href="{{ base_path }}/images/profile-photo.jpg?v=M44lzPylqQ">
<link rel="icon" type="image/jpeg" href="{{ base_path }}/images/profile-photo.jpg?v=M44lzPylqQ" sizes="32x32">
<link rel="icon" type="image/jpeg" href="{{ base_path }}/images/profile-photo.jpg?v=M44lzPylqQ" sizes="192x192">
<link rel="icon" type="image/jpeg" href="{{ base_path }}/images/profile-photo.jpg?v=M44lzPylqQ" sizes="96x96">
<link rel="icon" type="image/jpeg" href="{{ base_path }}/images/profile-photo.jpg?v=M44lzPylqQ" sizes="16x16">
<link rel="shortcut icon" href="/images/profile-photo.jpg?v=M44lzPylqQ">
<!-- The colour a mobile browser paints its own chrome with. It has to follow
     the site's default scheme, or the bar above a dark page stays white. -->
<meta name="theme-color" content="{% if site_theme == 'dark' %}#252525{% else %}#F4F1EC{% endif %}">
<!-- relative_url, not base_path. base_path is site.url, and `jekyll serve`
     rewrites that to http://localhost:4000 whatever the config says, so
     previewing on http://127.0.0.1:4000 pulled this sheet cross-origin and the
     font it asks for was refused by CORS: every Academicons glyph rendered as a
     tofu box. main.css has always used relative_url; this now matches. -->
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


<!-- end custom head snippets -->
