<!-- Mid-Autumn Festival mark: the moon rabbit, with Chang'e crossing the moon
     behind him.

     Everything that has to stay dark (Chang'e, the rabbit) is drawn inside a
     moon disc that is warm gold in both colour schemes, so the dark shapes are
     always read against the same ground and never against the page. That is what
     keeps the mark legible in light and dark alike. Only the disc's rim changes
     between schemes, since it is the one edge that meets the page.

     Chang'e keeps to a band across the top of the disc. She and the rabbit are
     the same ink, so anywhere they overlap for long they read as one blob; up
     there she only ever grazes his ear tips, which is enough to show she passes
     behind him.

     Colours and motion come from _sass/_mid-autumn.scss. -->
<svg class="mid-autumn" viewBox="0 0 32 32" width="34" height="34"
     role="img" aria-label="Mid-Autumn Festival" focusable="false">
  <title>Mid-Autumn Festival</title>

  <defs>
    <clipPath id="mid-autumn-disc">
      <circle cx="16" cy="15.5" r="12"/>
    </clipPath>
  </defs>

  <circle class="mid-autumn__moon" cx="16" cy="15.5" r="12"/>

  <g class="mid-autumn__craters" clip-path="url(#mid-autumn-disc)">
    <circle cx="7.6" cy="12.4" r="1.9"/>
    <circle cx="25.6" cy="11.0" r="1.3"/>
    <circle cx="24.4" cy="19.6" r="1.0"/>
  </g>

  <!-- Chang'e, clipped to the disc so she is only ever seen against the moon -->
  <g clip-path="url(#mid-autumn-disc)">
    <g class="mid-autumn__change">
      <circle cx="0" cy="0" r="1.15"/>
      <circle cx="-0.75" cy="-1.0" r="0.6"/>
      <path d="M0.6,1.0 C1.5,1.9 1.5,3.2 0.4,3.9
               C-1.1,4.8 -3.4,4.5 -5.4,3.5
               C-3.7,3.5 -2.2,3.2 -1.2,2.5
               C-0.4,1.9 -0.1,1.4 0.6,1.0 Z"/>
      <path class="mid-autumn__ribbon" d="M-1.1,1.2 C-3.1,0.8 -5.4,1.4 -7.2,2.3"/>
      <path class="mid-autumn__ribbon" d="M-0.8,2.6 C-2.8,2.7 -5.0,3.4 -6.6,4.5"/>
    </g>
  </g>

  <!-- The rabbit is clipped to the disc too. He is drawn large enough to run
       past the rim at the bottom left, and any ink that crosses the rim is ink
       sitting on the page, which is the one thing this drawing must not do: on
       the dark scheme it would disappear. -->
  <g clip-path="url(#mid-autumn-disc)">
  <g class="mid-autumn__rabbit">
    <ellipse cx="12.5" cy="23.4" rx="4.6" ry="3.9"/>
    <ellipse cx="16.5" cy="24.2" rx="2.4" ry="2.7"/>

    <g class="mid-autumn__head">
      <path d="M14.7,16.6 C13.8,14.2 13.8,12.7 14.75,12.55
               C15.7,12.45 16.3,13.85 16.2,16.25 Z"/>
      <path d="M17.3,16.4 C17.65,14.05 18.45,12.75 19.3,13.0
               C20.15,13.25 19.85,14.8 18.9,16.8 Z"/>
      <circle cx="16.4" cy="19.0" r="2.85"/>
      <circle class="mid-autumn__eye" cx="17.5" cy="18.45" r="0.47"/>
    </g>

    <path class="mid-autumn__paw" d="M15.9,23.3 C17.0,22.9 18.0,22.8 18.7,23.0"/>
  </g>
  </g>

  <circle class="mid-autumn__rim" cx="16" cy="15.5" r="12"/>
</svg>
