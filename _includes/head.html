{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% include structured-data.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Theme detection (must run early to prevent flash) -->
<!-- The <html> tag already carries the site default (see _layouts/default.html);
     this only overrides it when the visitor has picked a theme before. Always
     leaving an explicit data-theme is what tells _main.js which scheme to use. -->
<script>
  (function() {
    var stored = localStorage.getItem('theme');
    var theme = (stored === 'light' || stored === 'dark')
      ? stored
      : '{% if site.christmas_theme %}dark{% else %}light{% endif %}';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

{% if site.christmas_theme %}
<!-- Preload Christmas wreath image for faster display -->
<link rel="preload" href="/images/christmas/wreath-centered.png" as="image">
{% endif %}

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<meta http-equiv="cleartype" content="on">
