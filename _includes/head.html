{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% include structured-data.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Theme detection (must run early to prevent flash) -->
<!-- The <html> tag already carries the site default (see _layouts/default.html);
     this only overrides it when the visitor has picked a theme before. Always
     leaving an explicit data-theme is what tells _main.js which scheme to use. -->
<script>
  (function() {
    /* localStorage throws, not returns null, when site data is blocked (private
       windows, cookies off, some webviews). Without the guard this threw before
       setting the attribute, and every later script in the same block was skipped.
       Block comments only in inline scripts: GitHub Pages builds in production,
       where compress_html puts the page on one line and a // comment swallows
       the rest of the script. */
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var theme = (stored === 'light' || stored === 'dark')
      ? stored
      : '{{ site_theme }}';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Data saver. A browser that reports Save-Data or a 2G connection gets the
     paper animations as stills and the seasonal decorations paused (see
     _sass/_deferred-media.scss and _sass/_seasonal.scss). Only Chromium-based
     browsers report either; everywhere else nothing changes. -->
<script>
  (function() {
    try {
      var connection = navigator.connection;
      if (connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || ''))) {
        document.documentElement.classList.add('save-data');
      }
    } catch (e) {}
  })();
</script>

{% if site.seasonal_theme == 'christmas' %}
<!-- Preload Christmas wreath image for faster display -->
<link rel="preload" href="/images/christmas/wreath-centered.png" as="image">
{% endif %}

<!-- For all browsers -->
<!-- ?v= is the build time, so every deploy gets new stylesheet and script URLs.
     GitHub Pages lets browsers keep each file for 10 minutes, and without it a
     reload right after a deploy paired the new HTML with the cached old CSS:
     the seasonal SVGs, unsized and unfilled, showed as large black shapes. -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<meta http-equiv="cleartype" content="on">
